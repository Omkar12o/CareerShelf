name: build-images

# Proves the 24/7 bundle actually builds, and publishes ready-to-pull images.
# A VPS install then only needs: docker compose pull && up -d.
on:
  push:
    branches: [main]
    paths:
      # Only changes that actually alter the images.
      - "deploy/Dockerfile.web"
      - "deploy/Dockerfile.store"
      - "deploy/Dockerfile.gateway"
      - "deploy/docker-compose.yml"
      - "deploy/Caddyfile"
      - "deploy/bootstrap.mjs"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: deploy/Dockerfile.web
          - name: store
            context: .
            dockerfile: deploy/Dockerfile.store
          - name: gateway
            context: ./youpi-pg
            # `--file` is resolved against the workspace, not the build context.
            dockerfile: youpi-pg/Dockerfile.careershelf
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Youpi gateway (sibling, as compose expects)
        if: matrix.name == 'gateway'
        run: |
          git clone --depth 1 https://github.com/youpi-pg/YouPI-PG.git youpi-pg
          cp deploy/Dockerfile.gateway youpi-pg/Dockerfile.careershelf
          printf 'node_modules\ndata\n.git\n.env\n.env.*\ncoverage\n' > youpi-pg/.dockerignore

      # GHCR image names must be lowercase, but the repository is Omkar12o/CareerShelf.
      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.name }}:latest
          build-args: |
            PUBLIC_ORIGIN=https://careershelf.example.com
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_ANON_KEY=build-time-placeholder
            VITE_YOUPI_MERCHANT_ID=00000000-0000-0000-0000-000000000001
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 https://github.com/youpi-pg/YouPI-PG.git youpi-pg
          cp deploy/Dockerfile.gateway youpi-pg/Dockerfile.careershelf
          printf 'node_modules\ndata\n.git\n.env\n.env.*\ncoverage\n' > youpi-pg/.dockerignore
      - name: Build the gateway image locally
        run: docker build -t careershelf-gateway -f youpi-pg/Dockerfile.careershelf youpi-pg
      - name: Boot the payment API and probe health
        run: |
          docker run -d --name pay \
            -e NODE_ENV=production -e YOUPI_BIND_HOST=0.0.0.0 -e PAYMENT_API_PORT=6100 \
            -e USE_SQLITE_FALLBACK=true -e SQLITE_DB_PATH=/app/data/test.sqlite \
            -e YOUPI_ALLOWED_ORIGINS=https://careershelf.example.com \
            -e BASE_PAYMENT_API_URL=https://careershelf.example.com \
            -e BASE_CHECKOUT_URL=https://careershelf.example.com \
            -e DEFAULT_PAYEE_VPA=test@upi \
            -e COIN_STORE_WEBHOOK_SECRET=test-secret \
            -e ENCRYPTION_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e OBSERVER_API_TOKEN=test-observer \
            -e ADMIN_API_TOKEN=test-admin \
            -e INTERNAL_SERVICE_TOKEN=test-internal \
            -e DEVICE_CREDENTIAL_KEY=0123456789abcdef0123456789abcdef \
            -e BLIND_INDEX_KEY=fedcba9876543210fedcba9876543210 \
            -p 6100:6100 careershelf-gateway
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6100/api/v1/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs pay --tail 40
          test "$code" = "200"
